<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>曜金｜智慧記帳</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color-scheme:dark;--bg:#080f25;--panel:#14213bba;--line:#ffffff20;--text:#f5f7ff;--muted:#a8b5d0;--accent:#9c87ff;--mint:#45e4bd;--red:#ff7895;--shadow:#02071688}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 5% 0%,#392a72 0,transparent 38%),radial-gradient(ellipse at 95% 15%,#125d65 0,transparent 35%),var(--bg);color:var(--text);min-height:100vh}body.light{color-scheme:light;--bg:#edf2fa;--panel:#ffffffdc;--line:#253a5a20;--text:#1b2946;--muted:#65728c;--shadow:#7484a52b;background:radial-gradient(ellipse at 0 0,#dcd4ff,transparent 40%),radial-gradient(ellipse at 100% 10%,#c9fff1,transparent 40%),var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:active{transform:scale(.96)}.app{max-width:1250px;margin:auto;padding:26px 22px 110px}.top,.toolbar,.between,.actions,.filters,.monthbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:23px}.logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--mint));color:#10162c}.sub{color:var(--muted);font-size:13px}.nav{display:flex;gap:7px}.nav button,.ghost,.pill{background:#ffffff0b;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:11px 15px}.nav button.active,.primary{background:linear-gradient(120deg,#8569f5,#35cbb5);color:white;border:0}.primary{padding:12px 18px;border-radius:13px;font-weight:750;box-shadow:0 9px 25px #6c61e333}.iconbtn{display:inline-flex;align-items:center;gap:7px}.hero{margin:34px 0 22px}.hero h1{font-size:clamp(27px,4vw,39px);margin:6px 0}.monthbar{justify-content:flex-start}.monthbar input{max-width:165px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.glass{background:var(--panel);border:1px solid var(--line);border-radius:21px;box-shadow:0 15px 40px var(--shadow);backdrop-filter:blur(18px);padding:21px;min-width:0}.stat{position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;animation:rise .55s both}.stat:nth-child(2){animation-delay:.07s}.stat:nth-child(3){animation-delay:.14s}.stat:nth-child(4){animation-delay:.21s}.stat:hover{transform:translateY(-5px);box-shadow:0 22px 42px var(--shadow)}.stat:after{content:'';position:absolute;right:-40px;top:-55px;width:135px;height:135px;border-radius:50%;background:var(--accent);filter:blur(75px);opacity:.32}.stat .value{font-size:clamp(22px,2.6vw,34px);font-weight:850;letter-spacing:-1px;margin-top:17px;overflow-wrap:anywhere}.mint{color:var(--mint)}.red{color:var(--red)}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chartbox{height:280px;position:relative}.chartbox canvas{width:100%!important;height:100%!important}.wide{grid-column:1/-1}.section-title{font-size:18px;font-weight:800;margin:0 0 16px}.view{display:none;animation:rise .35s both}.view.active{display:block}.tablewrap{overflow-x:auto}.records{width:100%;border-collapse:collapse}.records th,.records td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.records th{color:var(--muted);font-weight:500;font-size:13px}.records td:last-child{text-align:right}.mini{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:9px;padding:7px 10px}.mini.danger{color:var(--red)}input,select,textarea{background:#ffffff0c;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;width:100%;outline:none}select option{background:#17233b;color:white}input:focus,select:focus,textarea:focus{border-color:var(--accent)}label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field.full{grid-column:1/-1}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.quick button{border:1px solid var(--line);background:#ffffff0d;color:var(--text);padding:9px 13px;border-radius:10px}.type{display:flex;gap:9px}.type button{flex:1;padding:12px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:12px}.type button.active{background:#8e79f044;border-color:var(--accent)}.budgettrack{height:18px;background:#ffffff16;border-radius:99px;overflow:hidden;margin:22px 0}.budgetfill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--accent));border-radius:99px;transition:width .6s}.warning{color:#ffca75}.over{color:var(--red);animation:pulse 1.3s infinite}.toast{position:fixed;top:20px;right:20px;background:#243b58;color:white;border:1px solid #ffffff44;padding:13px 18px;border-radius:14px;z-index:50;opacity:0;transform:translateY(-12px);pointer-events:none;transition:.3s}.toast.show{opacity:1;transform:none}.bottom{display:none}.empty{color:var(--muted);text-align:center;padding:24px}.note{color:var(--muted);line-height:1.65;font-size:13px}.particle{position:fixed;z-index:100;pointer-events:none;width:7px;height:7px;border-radius:50%;animation:confetti .85s ease-out forwards}@keyframes confetti{to{transform:translate(var(--dx),var(--dy)) rotate(380deg);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes pulse{50%{opacity:.5}}@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.charts{grid-template-columns:1fr}.wide{grid-column:auto}.top .nav{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);backdrop-filter:blur(24px);border-top:1px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:20;justify-content:space-around}.bottom button{background:none;border:0;color:var(--muted);display:grid;place-items:center;gap:4px;font-size:11px;padding:7px;min-width:62px}.bottom button.active{color:var(--mint)}}@media(max-width:520px){.app{padding:18px 13px 105px}.cards{gap:10px}.glass{padding:15px;border-radius:17px}.stat .value{font-size:22px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{margin:24px 0 15px}.chartbox{height:245px}.filters>*{width:100%}.top .sub{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo"><i data-lucide="wallet-cards"></i></div><div>曜金 <span style="color:var(--mint)">Money</span><div class="sub">你的個人智慧財務空間</div></div></div><nav class="nav" id="desktopNav"></nav><div class="actions"><button class="ghost iconbtn" id="themeBtn" title="切換主題"><i data-lucide="sun-moon"></i></button><button class="primary iconbtn" id="newBtn"><i data-lucide="plus"></i> 新增記帳</button></div></header><div class="hero"><div class="sub">FINANCIAL OVERVIEW</div><h1 id="heading">掌握每一筆，成就每一步 ✨</h1><div class="monthbar"><button class="mini" id="prevMonth" aria-label="上個月">‹</button><input type="month" id="month"><button class="mini" id="nextMonth" aria-label="下個月">›</button><span class="sub" id="demoTag"></span></div></div><main><section id="dashboard" class="view active"><div class="cards" id="stats"></div><div class="charts"><div class="glass"><h2 class="section-title">支出類別分布</h2><div class="chartbox"><canvas id="donut"></canvas></div></div><div class="glass"><h2 class="section-title">近六個月收支</h2><div class="chartbox"><canvas id="bars"></canvas></div></div><div class="glass wide"><h2 class="section-title">每日支出趨勢</h2><div class="chartbox"><canvas id="line"></canvas></div></div></div></section><section id="add" class="view"><div class="glass" style="max-width:720px;margin:auto"><div class="between"><h2 class="section-title" id="formTitle">新增交易</h2><button class="mini" id="cancelEdit">清空</button></div><form id="txForm"><div class="formgrid"><div class="field full"><label>交易類型</label><div class="type"><button type="button" data-type="expense" class="active">↗ 支出</button><button type="button" data-type="income">↙ 收入</button></div></div><div class="field"><label for="amount">金額（NT$）</label><input id="amount" type="number" inputmode="decimal" min="0.01" max="999999999999" step="0.01" required placeholder="0"><div class="quick"><button type="button" data-amount="100">+100</button><button type="button" data-amount="500">+500</button><button type="button" data-amount="1000">+1,000</button></div></div><div class="field"><label for="date">日期</label><input id="date" type="date" required></div><div class="field"><label for="category">類別</label><select id="category"></select></div><div class="field"><label for="note">備註</label><input id="note" maxlength="160" placeholder="例如：午餐、薪水"></div><div class="field full"><button class="primary" type="submit" style="width:100%;padding:15px">儲存交易</button></div></div></form></div></section><section id="history" class="view"><div class="glass"><div class="between"><h2 class="section-title">交易紀錄</h2><span class="sub" id="recordCount"></span></div><div class="filters"><input id="search" placeholder="搜尋備註或類別" style="flex:2"><select id="filterType" style="flex:1"><option value="all">全部收支</option><option value="income">收入</option><option value="expense">支出</option></select><select id="filterCat" style="flex:1"><option value="all">全部類別</option></select></div><div class="tablewrap"><table class="records"><thead><tr><th>日期</th><th>類別 / 備註</th><th>金額</th><th>操作</th></tr></thead><tbody id="recordBody"></tbody></table></div></div></section><section id="budget" class="view"><div class="glass" style="max-width:780px"><h2 class="section-title">每月預算管理</h2><label for="budgetInput">選取月份的總支出預算（NT$）</label><div class="actions"><input type="number" min="0" max="999999999999" step="1" id="budgetInput" placeholder="輸入預算" style="flex:1"><button class="primary" id="saveBudget">儲存預算</button></div><div class="budgettrack"><div class="budgetfill" id="budgetFill"></div></div><div class="between"><div><div class="sub">已使用</div><h2 id="spent"></h2></div><div><div class="sub">剩餘可用</div><h2 id="remaining"></h2></div></div><p id="budgetMessage" class="note"></p></div></section><section id="settings" class="view"><div class="glass" style="max-width:780px"><h2 class="section-title">資料與備份</h2><p class="note">資料僅保存在此瀏覽器的 LocalStorage，不會自動同步至其他裝置。清除瀏覽器資料可能造成遺失，建議定期匯出備份。</p><div class="actions" style="justify-content:flex-start"><button class="primary" id="exportBtn">匯出 JSON 備份</button><button class="ghost" id="importBtn">匯入 JSON 備份</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h2 class="section-title">示範資料</h2><p class="note" id="demoInfo"></p><button class="ghost" id="clearDemo">一鍵清除示範資料</button><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><button class="mini danger" id="clearAll">清除全部交易與預算</button></div></section></main></div><nav class="bottom" id="mobileNav"></nav><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
(()=>{'use strict';const KEY='yaojin-money-v1',THEME='yaojin-theme',expense=['餐飲','交通','購物','娛樂','生活用品','醫療','教育','房貸','投資','其他'],income=['薪資','兼職收入','投資收入','其他收入'],icons={'餐飲':'utensils','交通':'car','購物':'shopping-bag','娛樂':'gamepad-2','生活用品':'house','醫療':'heart-pulse','教育':'graduation-cap','房貸':'landmark','投資':'chart-no-axes-combined','其他':'ellipsis','薪資':'briefcase-business','兼職收入':'laptop','投資收入':'trending-up','其他收入':'gift'},tabs=[['dashboard','總覽','layout-dashboard'],['add','記帳','circle-plus'],['history','紀錄','list'],['budget','預算','target'],['settings','設定','settings-2']],$=id=>document.getElementById(id),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},monthOf=d=>d.slice(0,7),money=n=>'NT$'+Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2}),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let state,selected=today().slice(0,7),type='expense',editing=null,charts={};function seed(){let now=new Date(),tx=[];for(let i=0;i<6;i++){let y=now.getFullYear(),m=now.getMonth()-i,base=new Date(y,m,1),ym=`${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}`,days=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();[['income','薪資',42000+i*900,5],['income','兼職收入',9000+i*300,Math.min(15,days)],['expense','房貸',21000,Math.min(8,days)],['expense','餐飲',4600+i*130,Math.min(12,days)],['expense','交通',1200+i*70,Math.min(18,days)],['expense','生活用品',1800+i*90,Math.min(21,days)],['expense','娛樂',1100+i*60,Math.min(24,days)]].forEach(([t,c,a,day],j)=>{let date=`${ym}-${String(day).padStart(2,'0')}`;if(date<=today())tx.push({id:crypto.randomUUID(),type:t,category:c,amount:a,date,note:'示範交易',demo:true})})}return {transactions:tx,budgets:{[selected]:35000},demoSeeded:true}}function load(){try{let raw=localStorage.getItem(KEY);if(raw){let data=JSON.parse(raw);if(data&&Array.isArray(data.transactions)&&data.budgets&&typeof data.budgets==='object')return data}}catch(e){}return seed()}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('儲存失敗：瀏覽器儲存空間可能已滿');return false}}state=load();if(!localStorage.getItem(KEY))persist();if(localStorage.getItem(THEME)==='light')document.body.classList.add('light');function toast(msg){let e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),2600)}function icon(){if(window.lucide)lucide.createIcons()}function navigate(id){tabs.forEach(([key])=>$(key).classList.toggle('active',key===id));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));if(id==='add')$('amount').focus();render();window.scrollTo({top:0,behavior:reduced?'instant':'smooth'})}for(let [id,label,ico]of tabs){for(let host of ['desktopNav','mobileNav']){let b=document.createElement('button');b.dataset.nav=id;b.innerHTML=`<i data-lucide="${ico}" width="18"></i><span>${label}</span>`;b.onclick=()=>navigate(id);$(host).appendChild(b)}}$('month').value=selected;$('date').value=today();function changeMonth(delta){let [y,m]=selected.split('-').map(Number),d=new Date(y,m-1+delta,1);selected=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;$('month').value=selected;render()}$('prevMonth').onclick=()=>changeMonth(-1);$('nextMonth').onclick=()=>changeMonth(1);$('month').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value))selected=e.target.value;render()};$('newBtn').onclick=()=>{resetForm();navigate('add')};$('themeBtn').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem(THEME,document.body.classList.contains('light')?'light':'dark');render()};function setType(t){type=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===t));$('category').innerHTML=(t==='expense'?expense:income).map(c=>`<option>${c}</option>`).join('')}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));document.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>{$('amount').value=(Number($('amount').value)||0)+Number(b.dataset.amount)});function resetForm(){editing=null;$('formTitle').textContent='新增交易';$('txForm').reset();setType('expense');$('date').value=today()}$('cancelEdit').onclick=resetForm;setType('expense');function celebrate(){if(reduced)return;for(let i=0;i<25;i++){let p=document.createElement('span');p.className='particle';p.style.left='50%';p.style.top='45%';p.style.background=['#45e4bd','#a68aff','#ffcd75','#ff7895'][i%4];p.style.setProperty('--dx',(Math.random()-.5)*440+'px');p.style.setProperty('--dy',(Math.random()-.5)*360+'px');document.body.append(p);setTimeout(()=>p.remove(),950)}}$('txForm').onsubmit=e=>{e.preventDefault();let amount=Number($('amount').value),date=$('date').value,category=$('category').value;if(!Number.isFinite(amount)||amount<=0||amount>999999999999||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!(type==='expense'?expense:income).includes(category)){toast('請確認金額、日期與類別');return}let tx={id:editing||crypto.randomUUID(),type,amount,date,category,note:$('note').value.trim(),demo:false};if(editing){let i=state.transactions.findIndex(t=>t.id===editing);if(i<0)return;state.transactions[i]=tx}else state.transactions.push(tx);if(!persist())return;selected=monthOf(date);$('month').value=selected;resetForm();celebrate();toast('交易已成功儲存');navigate('dashboard')};function current(){return state.transactions.filter(t=>monthOf(t.date)===selected)}function sum(arr,t){return arr.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0)}function animate(el,end,pct=false){let start=0,t0=performance.now(),dur=reduced?0:650;function frame(t){let f=dur?Math.min((t-t0)/dur,1):1;let v=end*(1-Math.pow(1-f,3));el.textContent=pct?v.toFixed(1)+'%':money(v);if(f<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}function renderStats(){let a=current(),inc=sum(a,'income'),out=sum(a,'expense'),vals=[inc,out,inc-out,inc>0?(inc-out)/inc*100:0],names=['本月總收入','本月總支出','本月結餘','本月儲蓄率'],colors=['mint','red','','mint'];$('stats').innerHTML=names.map((n,i)=>`<article class="glass stat"><div class="sub">${n}</div><div class="value ${colors[i]}" id="stat${i}"></div><div class="sub" style="margin-top:12px">${['收入統計','支出統計','收入 − 支出','結餘 ÷ 收入'][i]}</div></article>`).join('');vals.forEach((v,i)=>animate($('stat'+i),v,i===3))}function chartDefaults(){return {responsive:true,maintainAspectRatio:false,animation:{duration:reduced?0:650},plugins:{legend:{labels:{color:getComputedStyle(document.body).getPropertyValue('--text').trim(),usePointStyle:true}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label||ctx.label}: ${money(ctx.parsed.y??ctx.parsed)}`}}},scales:{x:{ticks:{color:getComputedStyle(document.body).getPropertyValue('--muted').trim()},grid:{display:false}},y:{ticks:{color:getComputedStyle(document.body).getPropertyValue('--muted').trim(),callback:v=>v.toLocaleString()},grid:{color:'#8291b022'}}}}}function draw(id,kind,data,opts){if(!window.Chart){$(id).parentElement.innerHTML='<p class="empty">圖表需要網路載入 Chart.js，記帳功能仍可正常使用。</p>';return}if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),{type:kind,data,options:opts})}function renderCharts(){if(!window.Chart)return;let a=current().filter(t=>t.type==='expense'),groups=expense.map(c=>a.filter(t=>t.category===c).reduce((s,t)=>s+t.amount,0)),active=expense.map((c,i)=>[c,groups[i]]).filter(x=>x[1]>0),palette=['#a68aff','#45e4bd','#ffca75','#ff7895','#5cb5ff','#a1d75c','#ff9c6b','#7d9ef7','#c78de5','#8fd1cb'],base=chartDefaults();draw('donut','doughnut',{labels:active.length?active.map(x=>x[0]):['尚無支出'],datasets:[{data:active.length?active.map(x=>x[1]):[1],backgroundColor:active.length?active.map(x=>palette[expense.indexOf(x[0])]):['#66718a55'],borderWidth:0,hoverOffset:10}]},{...base,cutout:'68%',animation:{animateRotate:!reduced,duration:reduced?0:850
